<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Chamada SUS{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar" role="navigation" aria-label="main navigation">
        <div class="navbar-brand">
            <a href="{{ url_for('main.index') }}" class="navbar-item">
                <strong>Sistema de Chamada SUS</strong>
            </a>
        </div>
        <div class="navbar-menu">
            <div class="navbar-start">
                <a href="{{ url_for('main.index') }}" class="navbar-item">Início</a>
                <a href="{{ url_for('main.reception') }}" class="navbar-item">Recepção</a>
                <a href="{{ url_for('main.operator') }}" class="navbar-item">Operador</a>
                <a href="{{ url_for('admin.index') }}" class="navbar-item">Admin</a>
            </div>
            <div class="navbar-end">
                <div class="navbar-item" id="connection-status">
                    <span class="status-indicator offline"></span>
                    <span id="status-text">Verificando conexão...</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content" role="main">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer" role="contentinfo">
        <p>Sistema de Chamada SUS - Integrado ao e-SUS</p>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
